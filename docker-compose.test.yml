version: '3.8'

services:
  # MinIO - S3-compatible object storage for testing
  minio:
    image: minio/minio:latest
    container_name: psitransfer-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Client - Creates test bucket on startup
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb minio/psitransfer-test --ignore-existing;
      mc anonymous set download minio/psitransfer-test;
      echo 'MinIO bucket created successfully';
      "

  # PsiTransfer with filesystem storage (default)
  psitransfer-fs:
    build: .
    container_name: psitransfer-filesystem
    ports:
      - "3000:3000"
    volumes:
      - psitransfer-data:/app/data
    environment:
      NODE_ENV: production
      PSITRANSFER_PORT: 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PsiTransfer with S3/MinIO storage
  psitransfer-s3:
    build: .
    container_name: psitransfer-s3
    depends_on:
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PSITRANSFER_PORT: 3000
      PSITRANSFER_STORAGE: '{"type":"s3","bucket":"psitransfer-test","region":"us-east-1","signedUrlExpiry":3600}'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # For MinIO, we need to set the endpoint
      AWS_ENDPOINT_URL: http://minio:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
  psitransfer-data:

networks:
  default:
    name: psitransfer-test-network
